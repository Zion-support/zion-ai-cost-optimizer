<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Zion AI Cost Optimizer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:120px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;cursor:pointer}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>💰 Zion AI Cost Optimizer</h1><p>Estimate cloud waste and potential savings in seconds.</p><label>Monthly cloud spend ($): <input id="spend" type="number" value="10000"></label> <label>Avg utilization (%): <input id="util" type="number" value="35"></label> <button onclick="calc()">Analyze</button><div id="out"></div><script>function calc(){const s=+document.getElementById('spend').value,u=+document.getElementById('util').value;const idle=s*Math.max(0,(60-u)/100)*0.6,rs=s*0.12,sp=s*0.18;document.getElementById('out').textContent=`Estimated monthly waste: $${Math.round(idle).toLocaleString()}\nRightsizing savings: $${Math.round(rs).toLocaleString()}/mo\nCommitment discounts: $${Math.round(sp).toLocaleString()}/mo\nTotal opportunity: ~$${Math.round(idle+rs+sp).toLocaleString()}/mo (${Math.round((idle+rs+sp)/s*100)}% of spend)\n\nFull optimization audit: contact commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-cost-optimizer">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-finops/">AI FinOps</a></p></body></html>
